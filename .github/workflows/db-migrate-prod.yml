name: Apply Supabase migrations to prod

# Applies unapplied Supabase migrations to Institute PRODUCTION, triggered
# ONLY by a successful completion of db-migrate-test.yml's "Apply Supabase
# migrations to test" workflow (see `on.workflow_run` below) whose SOURCE
# branch was `main`. There is deliberately no `push:` trigger and no
# `workflow_dispatch:` anywhere in this file, as a YAML key or otherwise.
#
# This is the round-4 finding-3 fix, converged with Sandra's identical split
# (Sandra PR #345, merged, zero Codex findings on re-review) rather than
# reinvented -- see that PR and db-migrate-test.yml's own header for the full
# history of why a workflow_dispatch-triggered file cannot defend itself.
#
# ---------------------------------------------------------------------------
# Why this file has NO workflow_dispatch trigger
# ---------------------------------------------------------------------------
# db-migrate-test.yml previously required a workflow_dispatch input
# (`expected_sha`) and a step that refused unless the checked-out SHA
# matched it. That check could not defend itself: `workflow_dispatch` always
# runs the workflow DEFINITION from the ref the user selects when
# dispatching, not from `main`. A branch could simply delete that
# verification step from its own copy of the file, then dispatch itself, and
# GitHub would run the edited version. That is the same
# "the checker is authored by the thing it's checking" self-authentication
# problem Sandra hit with an `if:`-guarded production job in the same file
# as its dispatchable test job (Sandra round 6), and it is structural: no
# in-file check can close it, because the attacker controls the file being
# checked.
#
# The property that is actually true, and the reason this file is split out:
# GitHub only offers `workflow_dispatch` as a way to manually run a workflow
# if that trigger is declared in the copy of the workflow file ON THE
# DEFAULT BRANCH. A branch cannot make a workflow file dispatchable by
# adding `workflow_dispatch:` to its own copy -- dispatch eligibility for a
# given workflow file is read from `main`, not from whatever ref you're
# trying to dispatch. So: this file (db-migrate-prod.yml) simply never
# declares `workflow_dispatch:`, on ANY branch that could plausibly become
# `main`'s copy, and there is therefore no "Run workflow" button or API call
# that can invoke it manually against any ref, ever -- not because a
# condition is checked and passes, but because the invocation mechanism does
# not exist for this file at all.
#
# This property lives entirely in `main`'s copy of this file. It is
# therefore only as strong as branch protection on `main` -- a force-push to
# `main` that reintroduced a `workflow_dispatch:` trigger into this exact
# file would recreate the hole this split closes. That is one of the
# concrete reasons "Do not allow force pushes" on `main`'s branch protection
# rule matters here, not just for the ancestor-ref script's TOCTOU window
# (see scripts/assert-ref-is-main-or-ancestor.sh).
#
# ---------------------------------------------------------------------------
# How this replaces "run test, then run prod" ordering across two files
# ---------------------------------------------------------------------------
# GitHub Actions' `needs:` only orders jobs WITHIN one workflow file, so a
# split into two files needs a different mechanism. Replaced here with
# `on.workflow_run`, which fires when the named upstream workflow (by its
# top-level `name:`, matched exactly below) completes, plus two checks
# neither of which the upstream workflow's own file can influence (because,
# like `workflow_dispatch` eligibility, `workflow_run`-triggered runs ALWAYS
# use the DEFAULT BRANCH's copy of the triggered file, regardless of what
# ref the upstream run was against):
#   - `github.event.workflow_run.conclusion == 'success'` -- a failed or
#     cancelled test run never reaches production.
#   - `github.event.workflow_run.head_branch == 'main'` -- without this,
#     someone dispatching db-migrate-test.yml against an unrelated branch
#     and having it pass would still fire this workflow_run event; this
#     check is what stops that from reaching production. (A dispatched test
#     run's `head_branch` is the actual dispatched branch name -- not
#     attacker-controllable independent of what ref was really selected.)
#   - `github.run_attempt == '1'` (round-5 finding 3) -- GitHub lets anyone
#     with write access manually re-run ANY completed workflow run, including
#     this one, via "Re-run jobs" in the Actions UI or API, regardless of its
#     trigger type. A rerun replays the ORIGINAL stored event payload: the
#     same `head_sha` and `head_branch` this job saw the first time, even if
#     `main` has since advanced. Nothing about having no workflow_dispatch
#     trigger stops that -- a rerun isn't a dispatch, it's a replay of a run
#     that already happened. A stale-but-successful old run, re-run today,
#     would still check out that old `head_sha` (still a valid ancestor of
#     current main, so the ancestor script would not catch it either) and
#     push it to production again, potentially re-applying an outdated
#     migration set against a database that has moved on. `run_attempt`
#     increments on every rerun and is `'1'` only for the run's original,
#     naturally-triggered execution, so requiring it here refuses a DIRECT
#     rerun of this production run.
#   - `github.event.workflow_run.run_attempt == '1'` (round-5 finding 3,
#     Codex round-6 correction) -- `github.run_attempt` above only guards a
#     rerun of THIS (production) run. It does nothing about a rerun of the
#     UPSTREAM db-migrate-test.yml run: GitHub reruns replay that run's
#     original head_sha/head_branch, and on completion still emit a brand
#     new `workflow_run` "completed" event for db-migrate-prod.yml -- only
#     the `requested` activity type is suppressed on rerun, not `completed`.
#     That new event starts a genuinely fresh production run (its OWN
#     `github.run_attempt` is `'1'`, so the check above does not catch it),
#     but the event payload still carries the stale upstream `head_sha`.
#     `github.event.workflow_run.run_attempt` is the UPSTREAM test run's own
#     attempt number, carried in that payload; requiring it to be `'1'`
#     refuses a production run triggered by a reran (rather than freshly
#     completed) test run. Both checks are required together: one closes a
#     rerun of this workflow, the other closes a rerun of the workflow that
#     triggers it. See
#     https://docs.github.com/en/actions/how-tos/manage-workflow-runs/re-run-workflows-and-jobs
#     and
#     https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
# The checkout below pins the EXACT commit that was tested
# (`github.event.workflow_run.head_sha`) rather than re-reading whatever
# `main` happens to point at when this job starts, so production always
# deploys precisely what test just verified.
#
# ---------------------------------------------------------------------------
# What this file reuses unchanged
# ---------------------------------------------------------------------------
# scripts/migration-rehearsal/check-migration-safety.mjs (the fail-closed
# safety gate: out-of-order re-apply, content fingerprinting, placeholder
# baseline) and scripts/migration-rehearsal/guarded-db-push.sh (the ONLY
# sanctioned way to chain gate -> verify -> push -> reconcile under one
# advisory lock) are the repository's production admission path. The retired
# print-production-repair-commands.sh tombstone is deliberately not a runbook.
# This workflow calls the guarded wrapper with `--target=institute-production`, which is
# already a fully-pinned entry in placeholder-baseline.json.
#
# ---------------------------------------------------------------------------
# Production environment tracking
# ---------------------------------------------------------------------------
# `environment: Production` records deployments and scopes production
# environment settings. It intentionally has no required-reviewer rule: this
# repository's reviewed release path is autonomous once its code and exact-SHA
# gates pass. The executable admission controls are the workflow_run predicates,
# exact tested-SHA checkout, replay guards, branch protection, and guarded push
# below; this comment does not claim a human approval gate that is not configured.
#
# Required secrets (set in GitHub -> Environments -> Production -> Secrets):
#   SUPABASE_ACCESS_TOKEN
#     A personal access token from
#     https://supabase.com/dashboard/account/tokens. Used only to resolve
#     the correct pooler host below (`supabase link`); never used to push.
#   PROD_SUPABASE_DB_PASSWORD
#     The production database password for project dhvfsyteqsxagokoerrx
#     (bmh-institute, us-east-1) -- from the Supabase dashboard, Connection
#     info -> Database password. Never logged; masked below.
#
# Why the pooler host is RESOLVED, not hardcoded: the wrong region/shard is a
# real, easy-to-get-wrong mistake. This
# workflow honours that by running `supabase link` (which the CLI resolves
# by hitting the Supabase API for the real project, not by guessing a
# hostname pattern) and reading the pooler host it writes to
# supabase/.temp/pooler-url -- the same approach Sandra's converged
# db-migrate-prod.yml uses, and the same connection the CLI itself just
# proved reachable.

on:
  workflow_run:
    workflows: ["Apply Supabase migrations to test"]
    types: [completed]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: bmh-institute-production-migrations
  cancel-in-progress: false

jobs:
  migrate-prod:
    name: Apply migrations to Institute production
    # `github.run_attempt == '1'` (round-5 finding 3): refuses a manual
    # "Re-run jobs" replay of THIS run. `github.event.workflow_run.run_attempt
    # == '1'` (round-5 finding 3, Codex round-6 correction): refuses a
    # production run triggered by a reran (not freshly completed) upstream
    # test run -- see the header comment above for why both are required.
    if: github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.run_attempt == '1' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Deployment tracking/configuration boundary; admission is enforced by the
    # executable predicates and guarded push above, not a human reviewer.
    environment: Production

    env:
      PROD_PROJECT_REF: dhvfsyteqsxagokoerrx

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Pin the EXACT commit that db-migrate-test.yml just verified,
          # rather than re-reading whatever `main` points at when this job
          # happens to start (main could have advanced in between).
          ref: ${{ github.event.workflow_run.head_sha }}
          # Full history (not the default shallow clone) so the ancestor
          # check below can actually walk from HEAD back to origin/main
          # instead of hitting the edge of a shallow fetch and guessing.
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse unless this ref is main or an ancestor of main (defense-in-depth; the real workflow_dispatch protection is this file declaring no workflow_dispatch trigger at all)
        # This step is NOT the primary defense against a dispatched or
        # unmerged ref reaching production -- that's the structural fact
        # (explained at the top of this file) that db-migrate-prod.yml
        # cannot be dispatched at all, plus the `head_branch == 'main'`
        # check on the job above. This script remains a second, independent
        # check against the pinned commit. See
        # scripts/assert-ref-is-main-or-ancestor.sh for the full rationale
        # and scripts/assert-ref-is-main-or-ancestor.test.sh for its test
        # coverage.
        run: bash scripts/assert-ref-is-main-or-ancestor.sh

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.109.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Link to production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PROD_SUPABASE_DB_PASSWORD }}
        run: |
          echo "::add-mask::$SUPABASE_DB_PASSWORD"
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "PROD_SUPABASE_DB_PASSWORD secret is required."
            exit 1
          fi
          supabase link --project-ref "$PROD_PROJECT_REF"

      - name: Resolve pooler connection info
        id: pooler
        # `supabase link` caches the project's resolved Supavisor pooler host
        # (region/shard) at supabase/.temp/pooler-url. Reading that instead
        # of hardcoding a pooler hostname avoids guessing wrong shard/region
        # -- this is the same connection the CLI itself just proved
        # reachable, rather than trusting a guessed hostname.
        run: |
          node -e '
            const fs = require("node:fs");
            const raw = fs.readFileSync("supabase/.temp/pooler-url", "utf8").trim();
            const u = new URL(raw);
            const out = [
              `host=${u.hostname}`,
              `port=${u.port || "5432"}`,
              `user=${decodeURIComponent(u.username)}`,
            ].join("\n");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, out + "\n");
          '

      - name: Refuse a stale tested SHA immediately before the push
        # Production jobs are serialized above. This final fresh fetch also
        # requires the exact SHA verified by the upstream test workflow to
        # remain current main; an older successful run cannot deploy after a
        # newer commit has reached main.
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Refusing production migration: tested SHA is no longer current main."
            exit 1
          fi

      - name: Apply pending migrations (safety gate chained to the push)
        # Same guarded wrapper db-migrate-test.yml's migrate-test job uses for
        # TEST. It runs check-migration-safety.mjs first under `set -e`; the
        # write is unreachable on a non-zero gate exit, and reconciliation
        # follows every attempted write. See guarded-db-push.sh's own header for the
        # full "checked == pushed" binding it enforces (directory, content,
        # database identity, history, and the advisory lock).
        env:
          PROD_SUPABASE_DB_PASSWORD: ${{ secrets.PROD_SUPABASE_DB_PASSWORD }}
          GUARDED_PUSH_EXPECTED_GIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "::add-mask::$PROD_SUPABASE_DB_PASSWORD"
          if [ -z "$PROD_SUPABASE_DB_PASSWORD" ]; then
            echo "PROD_SUPABASE_DB_PASSWORD secret is required."
            exit 1
          fi
          export PGHOST="${{ steps.pooler.outputs.host }}"
          export PGPORT="${{ steps.pooler.outputs.port }}"
          export PGDATABASE="postgres"
          export PGUSER="${{ steps.pooler.outputs.user }}"
          export PGPASSWORD="$PROD_SUPABASE_DB_PASSWORD"
          export SUPABASE_DB_PASSWORD="$PROD_SUPABASE_DB_PASSWORD"
          export PGSSLMODE="require"
          bash scripts/migration-rehearsal/guarded-db-push.sh --target=institute-production
