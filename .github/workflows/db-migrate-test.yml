name: Apply Supabase migrations to test

# The `migrate-test` job below pushes to the shared TEST project only. It is
# intentionally reachable by unrestricted `workflow_dispatch:` (no inputs, no
# SHA check) -- see "Why there is no expected_sha check" below.
#
# db-migrate-prod.yml, in this same directory, is what actually reaches
# PRODUCTION. It has NO workflow_dispatch trigger anywhere in its file; it
# fires only via `on.workflow_run` after THIS workflow completes successfully
# against `main` (matched by exact name below), which is a property GitHub
# enforces from the DEFAULT BRANCH's copy of that file, not the ref being
# dispatched. See db-migrate-prod.yml's header for the full rationale --
# converged with Sandra's identical split (Sandra PR #345, merged, zero
# Codex findings on re-review).
#
# ---------------------------------------------------------------------------
# Why there is no expected_sha check (round-4 finding 3)
# ---------------------------------------------------------------------------
# An earlier version of this job required a `workflow_dispatch` input
# `expected_sha` and a step that refused unless `github.sha` (the ref being
# dispatched) matched it. That check cannot defend itself: `workflow_dispatch`
# always runs the workflow DEFINITION from the branch selected at dispatch
# time, not from `main`. A branch that wanted to bypass the check could
# simply delete that verification step from its OWN copy of this file, then
# dispatch itself -- GitHub runs the edited version, input and all. The check
# was reviewing a file it did not control, which is the same
# self-authentication problem Sandra's round-6 `if:`-guarded production job
# had, one layer up.
#
# The fix is not a better self-check -- there isn't one available to a
# workflow_dispatch-triggered file, structurally. The fix is: this job only
# ever writes to the shared TEST project (`institute-test`; see
# guarded-db-push.sh below), which is recoverable and does not serve real
# users, so an unrestricted dispatch here carries none of production's risk
# -- exactly Sandra's reasoning for leaving its own TEST workflow
# unrestricted. The thing that DOES need defending -- production -- is
# defended structurally in db-migrate-prod.yml by having no dispatch trigger
# to attack at all, not by a check living inside the file it is supposed to
# be checking.

on:
  pull_request:
    paths:
      - ".github/workflows/db-migrate-test.yml"
      - ".github/workflows/db-migrate-prod.yml"
      - "scripts/assert-ref-is-main-or-ancestor.sh"
      - "scripts/migration-rehearsal/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/cleanup-fixture-catalog.ts"
      - "scripts/course-content/build-released-quiz-revision-rehearsal-sql.ts"
      - "scripts/course-content/build-manifest.mjs"
      - "scripts/course-content/revise-released-quizzes.ts"
      - "scripts/course-content/test-welcome-video-replacement-postgres.mjs"
      - "scripts/course-content/validate-manifest.mjs"
      - "scripts/fixture-boundary/**"
      - "scripts/sign-fixture-cleanup-evidence.ts"
      - "src/lib/fixture-cleanup/**"
      - "src/lib/course-import/released-quiz-revision*"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "content/course-manifests/bmh-employee-training.v1.json"
      - "content/course-manifests/archive/bmh-employee-training.legacy-release-20260721.v1.json"
      - "content/quiz-generation/question-bank.v1.json"
      - "docs/course-production/quiz-approvals.json"
      - "docs/course-production/quiz-content-review-request.v1.json"
      - "docs/course-production/released-quiz-revision-rehearsal-2026-07-22.json"
  # Intentionally unrestricted: see "Why there is no expected_sha check" above.
  # This dispatches whatever ref is selected against the TEST project only.
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  validate-pr-migrations:
    name: Validate migrations on PostgreSQL ${{ matrix.postgres }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "16", "17"]

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      FIXTURE_GATE_EXTERNAL_PG: "1"
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Install dependencies and PostgreSQL tools
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install --yes postgresql postgresql-client

      - name: Exercise the production migration safety wrapper
        if: matrix.postgres == '17'
        run: |
          npm run test:migration-gate:postgres
          node --test scripts/migration-rehearsal/run-rehearsal.test.mjs

      - name: Apply and adversarially verify every migration
        run: node scripts/fixture-boundary/run-controller-gate-pr-harness.mjs

      - name: Run Hugo and Institute lifecycle ownership Postgres acceptance
        run: |
          psql --set ON_ERROR_STOP=1 --file supabase/tests/064_institute_app_owned_role_access.sql
          psql --set ON_ERROR_STOP=1 --file supabase/tests/065_hugo_lifecycle_ownership.sql
          psql --set ON_ERROR_STOP=1 --file supabase/tests/066_institute_last_owner_guard.sql

      - name: Run released Welcome video replacement lifecycle
        env:
          WELCOME_VIDEO_REPLACEMENT_EXTERNAL_PG: "1"
          PGDATABASE: welcome_video_replacement_pg${{ matrix.postgres }}
        run: |
          createdb "$PGDATABASE"
          trap 'dropdb --if-exists "$PGDATABASE"' EXIT
          node scripts/course-content/test-welcome-video-replacement-postgres.mjs

      - name: Rehearse released quiz forward revision and rollback
        run: |
          npx tsx scripts/course-content/build-released-quiz-revision-rehearsal-sql.ts > "$RUNNER_TEMP/released-quiz-rehearsal.sql"
          psql --set ON_ERROR_STOP=1 --file "$RUNNER_TEMP/released-quiz-rehearsal.sql"

  migrate-test:
    name: Apply migrations to BMH test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: bmh-institute-seeded-e2e-shared-test-project
      cancel-in-progress: false

    env:
      TEST_PROJECT_REF: jvaabkchkihkjllehmft

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          # Exact canary verification follows immutable caption and held-video
          # approval history across predecessor commits.
          fetch-depth: 0
          persist-credentials: false

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.109.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Apply pending migrations (safety gate chained to the push)
        # The gate is NOT a separate step here on purpose. A separate step can be
        # re-ordered, disabled, or skipped with continue-on-error, leaving a bare
        # `db push --include-all` behind. guarded-db-push.sh runs
        # scripts/migration-rehearsal/check-migration-safety.mjs first under
        # `set -e`; the write is unreachable on a non-zero gate exit, and
        # reconciliation follows every attempted write.
        #
        # Why it exists: `--include-all` re-applies any migration missing from
        # remote history in filename order, with no notion of whether a later
        # migration already superseded it. That is the mechanism behind the
        # 2026-07-30 production incident (old
        # 20260728091000_hugo_access_provisioner.sql re-applied out of order,
        # reverting 6 hardened Hugo functions).
        env:
          TEST_SUPABASE_DB_PASSWORD: ${{ secrets.TEST_SUPABASE_DB_PASSWORD }}
        run: |
          echo "::add-mask::$TEST_SUPABASE_DB_PASSWORD"
          if [ -z "$TEST_SUPABASE_DB_PASSWORD" ]; then
            echo "TEST_SUPABASE_DB_PASSWORD secret is required."
            exit 1
          fi

          export PGHOST="aws-1-us-west-1.pooler.supabase.com"
          export PGPORT="5432"
          export PGDATABASE="postgres"
          export PGUSER="postgres.${TEST_PROJECT_REF}"
          export PGPASSWORD="$TEST_SUPABASE_DB_PASSWORD"
          export SUPABASE_DB_PASSWORD="$TEST_SUPABASE_DB_PASSWORD"
          export PGSSLMODE="require"
          bash scripts/migration-rehearsal/guarded-db-push.sh --target=institute-test

      - name: Install dependencies
        run: npm ci

      - name: Reconcile and verify the exact Tech Stack canary poster
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npm run course:video-posters:reconcile-canary -- \
            content/course-manifests/bmh-employee-training-canary.v1.json \
            --execute --confirm=bmh-employee-training-canary-v1
          npm run course:import -- verify \
            content/course-manifests/bmh-employee-training-canary.v1.json \
            --canary --execute

      - name: Run versioned completion and import guard Postgres acceptance
        env:
          TEST_SUPABASE_DB_PASSWORD: ${{ secrets.TEST_SUPABASE_DB_PASSWORD }}
        run: |
          echo "::add-mask::$TEST_SUPABASE_DB_PASSWORD"
          export PGHOST="aws-1-us-west-1.pooler.supabase.com"
          export PGPORT="5432"
          export PGDATABASE="postgres"
          export PGUSER="postgres.${TEST_PROJECT_REF}"
          export PGPASSWORD="$TEST_SUPABASE_DB_PASSWORD"
          export PGSSLMODE="require"
          psql --set ON_ERROR_STOP=1 --file supabase/tests/031_versioned_video_completion_and_submission_evidence.sql
          psql --set ON_ERROR_STOP=1 --file supabase/tests/034_import_release_and_fixture_dependency_guards.sql
          psql --set ON_ERROR_STOP=1 --file supabase/tests/063_video_checkpoint_ordering.sql
          psql --set ON_ERROR_STOP=1 --set fixture_cleanup_hosted_nonmutating=on --file supabase/tests/036_controller_verified_fixture_cleanup_gate_hosted.sql

      - name: Run Hugo and Institute lifecycle ownership Postgres acceptance
        env:
          TEST_SUPABASE_DB_PASSWORD: ${{ secrets.TEST_SUPABASE_DB_PASSWORD }}
        run: |
          echo "::add-mask::$TEST_SUPABASE_DB_PASSWORD"
          export PGHOST="aws-1-us-west-1.pooler.supabase.com"
          export PGPORT="5432"
          export PGDATABASE="postgres"
          export PGUSER="postgres.${TEST_PROJECT_REF}"
          export PGPASSWORD="$TEST_SUPABASE_DB_PASSWORD"
          export PGSSLMODE="require"
          psql --set ON_ERROR_STOP=1 --file supabase/tests/064_institute_app_owned_role_access.sql
          psql --set ON_ERROR_STOP=1 --file supabase/tests/065_hugo_lifecycle_ownership.sql
          psql --set ON_ERROR_STOP=1 --file supabase/tests/066_institute_last_owner_guard.sql

      - name: Run fail-closed provider acceptance against migrated test database
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          TEST_SUPABASE_DB_PASSWORD: ${{ secrets.TEST_SUPABASE_DB_PASSWORD }}
        run: |
          echo "::add-mask::$TEST_SUPABASE_DB_PASSWORD"
          ENCODED_PASSWORD="$(node -e 'process.stdout.write(encodeURIComponent(process.env.TEST_SUPABASE_DB_PASSWORD))')"
          echo "::add-mask::$ENCODED_PASSWORD"
          TEST_SUPABASE_DB_URL="postgresql://postgres.${TEST_PROJECT_REF}:${ENCODED_PASSWORD}@aws-1-us-west-1.pooler.supabase.com:5432/postgres" \
            npm run test:course-import-provider

      - name: Run no-write fixture cleanup transport canary
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/fixture-boundary/run-test-project-transport-canary.ts
